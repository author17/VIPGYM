<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP GYM Limassol | Transform Your Body</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .vip-gold { color: #D4AF37; }
        .bg-vip-gold { background-color: #D4AF37; }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1920');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 bg-gray-900 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">VIP <span class="vip-gold">GYM</span></h1>
            <div class="hidden md:flex space-x-6">
                <a href="#home" class="hover:text-yellow-500 transition">Home</a>
                <a href="#gallery" class="hover:text-yellow-500 transition">Gallery</a>
                <a href="#contact" class="hover:text-yellow-500 transition">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero-bg min-h-screen flex items-center justify-center text-center px-4">
        <div>
            <h2 class="text-4xl md:text-6xl font-bold mb-6">It's not fitness.<br><span class="vip-gold">It's life.</span></h2>
            <p class="text-xl text-gray-300 mb-8">Transform your body, elevate your life</p>
            <a href="#contact" class="bg-vip-gold text-black font-bold py-3 px-8 rounded-full hover:bg-yellow-500 transition">Join Now</a>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="py-16 px-4">
        <div class="max-w-6xl mx-auto">
            <h3 class="text-3xl font-bold text-center mb-12">Inside <span class="vip-gold">VIP GYM</span></h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="relative overflow-hidden rounded-lg shadow-lg group">
                    <img src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?w=600" class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105" alt="Gym Equipment">
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg group">
                    <img src="https://images.unsplash.com/photo-1534258936925-c48947387e3b?w=600" class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105" alt="Weight Training">
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg group">
                    <img src="https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=600" class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105" alt="Cardio Area">
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-16 bg-gray-800 text-center px-4">
        <h3 class="text-3xl font-bold mb-8">Visit <span class="vip-gold">VIP GYM</span></h3>
        <div class="max-w-2xl mx-auto space-y-4 text-lg">
            <p class="mb-4"><i class="fas fa-map-marker-alt vip-gold mr-2"></i>Steliou Kyriakide 31A, 3080, Limassol, Cyprus</p>
            <p class="mb-4"><i class="fas fa-phone vip-gold mr-2"></i>77 776525</p>
            <p class="mb-8"><i class="fas fa-envelope vip-gold mr-2"></i>vipgym.livelonger@gmail.com</p>
        </div>
    </section>

    <!-- Chatbot -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleChat()" class="bg-vip-gold text-black w-14 h-14 rounded-full shadow-lg text-2xl hover:bg-yellow-500 transition">
            <i class="fas fa-comment-dots"></i>
        </button>
        
        <div id="chatWindow" class="hidden absolute bottom-16 right-0 w-72 bg-gray-800 rounded-lg shadow-2xl border border-gray-700">
            <div class="bg-vip-gold text-black p-3 font-bold flex justify-between items-center">
                <span>VIP Gym AI</span>
                <button onclick="toggleChat()" class="text-black hover:text-gray-800"><i class="fas fa-times"></i></button>
            </div>
            <div id="chatMessages" class="h-48 p-4 overflow-y-auto text-sm space-y-2">
                <div class="bg-gray-700 p-2 rounded">Hello! Ask me about hours, location, or membership!</div>
            </div>
            <div class="p-3 border-t border-gray-700 flex">
                <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-gray-900 px-2 py-1 rounded-l focus:outline-none" onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" class="bg-vip-gold text-black px-3 py-1 rounded-r font-bold hover:bg-yellow-500 transition">Send</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleChat() {
            const chat = document.getElementById('chatWindow');
            chat.classList.toggle('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim().toLowerCase();
            const messages = document.getElementById('chatMessages');
            
            if (!msg) return;
            
            // Add user message
            messages.innerHTML += '<div class="bg-yellow-600 text-white p-2 rounded text-right">' + input.value + '</div>';
            input.value = '';
            
            // Add bot response
            setTimeout(() => {
                let reply = "Call us at 77 776525 for more info!";
                if (msg.includes('hour') || msg.includes('open')) reply = "Open Mon-Fri 7AM-10PM, Weekends 8AM-8PM";
                else if (msg.includes('location') || msg.includes('where')) reply = "Steliou Kyriakide 31A, Limassol";
                else if (msg.includes('price') || msg.includes('membership')) reply = "Call 77 776525 for pricing!";
                else if (msg.includes('hi') || msg.includes('hello')) reply = "Hey! Ready to transform? 💪";
                
                messages.innerHTML += '<div class="bg-gray-700 p-2 rounded">' + reply + '</div>';
                messages.scrollTop = messages.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
